name: Build GTA Replay Mod

on:
  push:
  pull_request:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-2019  # Use Windows Server 2019 with VS 2019
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86  # 32-bit build for GTA SA
        
    - name: Cache Plugin-SDK
      id: cache-plugin-sdk
      uses: actions/cache@v4
      with:
        path: |
          build/_deps
        key: ${{ runner.os }}-plugin-sdk-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-plugin-sdk-
    
    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 16 2019" -A Win32 -DCMAKE_BUILD_TYPE=Release
      shell: pwsh
      
    - name: Build GTAReplayMod
      run: |
        cmake --build build --config Release
        
    - name: Verify Build Output
      run: |
        if (Test-Path "build/Release/GTAReplayMod.asi") {
          Write-Host "✓ GTAReplayMod.asi built successfully!"
          Get-Item "build/Release/GTAReplayMod.asi" | Format-List
        } else {
          Write-Host "✗ Build failed - .asi file not found"
          exit 1
        }
      shell: pwsh
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GTAReplayMod-asi
        path: build/Release/GTAReplayMod.asi
        if-no-files-found: error
        
    - name: Create Release Package
      run: |
        mkdir release
        Copy-Item "build/Release/GTAReplayMod.asi" -Destination "release/"
        Copy-Item "COMPILATION_GUIDE.txt" -Destination "release/" -ErrorAction SilentlyContinue
        Copy-Item "PHASE2_EXPLANATION.txt" -Destination "release/" -ErrorAction SilentlyContinue
        Copy-Item "README.md" -Destination "release/" -ErrorAction SilentlyContinue
      shell: pwsh
      
    - name: Upload Release Package
      uses: actions/upload-artifact@v4
      with:
        name: GTAReplayMod-Complete-Package
        path: release/
        if-no-files-found: warn
